[build-system]
requires = [
  "poetry-core>=2.2.1",
  "poetry-dynamic-versioning>=1.9.1,==1.*",
  # list dependencies to work with PIP_NO_DEPS=1
  "MarkupSafe>=2.0",
  "dunamai>=1.25,==1.*",
  "jinja2==3.*",
  "packaging>=24.0",
  "tomlkit>=0.13",
]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "las-geoh5"
requires-python = ">=3.12,<3.15"

description = "Las/Geoh5 conversion"
license = "MIT"
license-files = [
    "LICENSE",
    "docs/source/THIRD_PARTY_SOFTWARE.rst",
]
keywords = [
    "las",
    "lasio",
    "well-logs",
    "borehole-data",
    "geoh5",
    "geology",
    "geophysics",
    "earth-sciences",
    "mining",
    "data-conversion",
    "interoperability",
]
readme = "package.rst"
dynamic = ["version", "classifiers"]
authors = [{ name = "Mira Geoscience", email = "support@mirageoscience.com" }]
maintainers = [{ name = "Benjamin Kary", email = "benjamink@mirageoscience.com" }]
dependencies = [
    # Mira packages
    "geoh5py @ git+https://github.com/MiraGeoscience/geoh5py.git@release/ga-4.9",
    # "geoh5py>=0.14.0b1,==0.14.*",
    # other direct dependencies
    "lasio>=0.33,<0.35",
    "numpy==2.4.*",
    "pydantic==2.12.*",
    "tqdm>=4.66.1,==4.*",
]

[project.urls]
repository = "https://github.com/MiraGeoscience/las-geoh5"
documentation  = "https://mirageoscience-las-geoh5.readthedocs-hosted.com/"
homepage = "https://www.mirageoscience.com/mining-industry-software/python-integration/"

[dependency-groups]
dev = [
    "Pygments",
    "pylint",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "packaging",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[project.scripts]
geoh5_to_las = 'las_geoh5.scripts.geoh5_to_las:main'
las_to_geoh5 = 'las_geoh5.scripts.las_to_geoh5:main'

[tool.poetry]
requires-poetry = ">=2.2.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Natural Language :: English",
]

packages = [
    { include = "las_geoh5" },
    { include = "las_geoh5-assets" },
]

include = [
    { path = "README.rst" },
    { path = "las_geoh5/_version.py", format = ["sdist", "wheel"] },
]
version = "0.0.0.dev0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.9.1, 1.*", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
bump = true
enable = true
fix-shallow-repository = true
strict = true
style = "pep440"
vcs = "git"

[tool.poetry-dynamic-versioning.substitution]
files = ["las_geoh5/_version.py", "_version.json"]
patterns = [
    '''(^__version__\s*(?::.*?)?=\s*['"])[^'"]*(['"])''',
    '''(^{\s*"version"\s*:\s*")[^"]*("\s*})''',
]

[tool.poetry-dynamic-versioning.files."las_geoh5/_version.py"]
persistent-substitution = true
initial-content = """
  __version__ = "0.0.0.dev0"
"""

[tool.poetry-dynamic-versioning.files."_version.json"]
persistent-substitution = true
initial-content = """
{ "version": "0.0.0.dev0" }
"""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B028",  # no-explicit-stacklevel for warnings.warn()
    "E501",  # line-too-long - code is reformatted (do not care about comments and docstring)
    "F401",  # unsused-import - covered by pycln
    "RUF015", # TODO
]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "B006",  # Do not use mutable data structures for argument defaults
    "B9",  # flake8-bugbear opiniated warnings
    "BLE",  # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C9",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff rules
    "RUF005",  # collection-literal-concatenation - wrong suggestion with numpy arrays
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# default formatting is just fine

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
scripts_are_modules = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true

plugins = [
    "pydantic.mypy",
]

[tool.pytest.ini_options]
#addopts =

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "pass",
    "if TYPE_CHECKING",
    "pragma: no cover"
]

fail_under = 80

[tool.coverage.run]
branch = true
source = ["las_geoh5"]
omit = []

[tool.coverage.html]
skip_empty = true
skip_covered = true

[tool.pylint.main]
extension-pkg-allow-list = ["numpy", "scipy"]
fail-on = ["F", "E", "W"]
jobs = 0
py-version = "3.10"

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "fixme",
]
enable = ["c-extension-no-member"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "x", "y", "z", "ex", "Run", "id", "_"]

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp", "__post_init__"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]
valid-metaclass-classmethod-first-arg = "cls"

[tool.pylint.design]
max-args = 9 # as long as not hitting too-many-positional-arguments
max-attributes = 15
max-bool-expr = 6
max-branches = 13
max-statements = 65

[tool.pylint.exceptions]
overgeneral-exceptions = ["builtin.BaseException", "builtin.Exception"]

[tool.pylint.imports]
deprecated-modules = ["optparse", "tkinter.tix"]
